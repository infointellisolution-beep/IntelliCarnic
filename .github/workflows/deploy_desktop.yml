name: Desktop Deployment & Build Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-validate:
    name: Validate Desktop Code Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, json
          coverage: none

      - name: Validate Composer JSON & Lock
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      - name: Verify Laravel Syntax & Artisan
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan --version
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
