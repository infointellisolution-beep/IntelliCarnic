name: Deploy Plus Agencia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Deploy to shared hosting via FTP (direct credentials)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 82.29.157.202
          username: u239804305.intellisolution.net
          password: "@IntelliSolution17"
          port: 21
          protocol: ftp
          server-dir: /public_html/intellicarnic/
          local-dir: dist/
          dangerous-clean-slate: false

