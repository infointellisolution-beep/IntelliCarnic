name: Deploy IntelliCarnic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to shared hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 82.29.157.202
          username: u239804305.intellisolution.net
          password: "@IntelliSolution17"
          port: 21
          protocol: ftps
          server-dir: /public_html/intellicarnic/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
          dangerous-clean-slate: false

      - name: Execute Artisan commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 82.29.157.202
          username: u239804305.intellisolution.net
          password: "@IntelliSolution17"
          port: 22
          script: |
            cd domains/intellisolution.net/public_html/intellicarnic
            composer install --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache
            php artisan route:cache
